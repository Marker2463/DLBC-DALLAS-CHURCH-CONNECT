<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>DLBC Church Connect</title>
    <meta name="description" content="A highly secure, confidential pastoral consultation platform for Deeper Life Bible Church." />
    <meta property="og:title" content="DLBC Church Connect" />
    <meta property="og:description" content="A highly secure, confidential pastoral consultation platform for Deeper Life Bible Church." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" />
    <link rel="icon" type="image/png" sizes="32x32" href="/src/assets/dlbc_church_connect_logo.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/src/assets/dlbc_church_connect_logo.png" />
    <script>
      // Prevent Vite HMR WebSocket connection errors in sandbox environment
      (function() {
        if (typeof window === 'undefined') return;
        var NativeWebSocket = window.WebSocket;
        if (!NativeWebSocket) return;
        
        window.WebSocket = function(url, protocols) {
          var urlStr = String(url || '');
          var isVite = (typeof protocols === 'string' && (protocols === 'vite-hmr' || protocols === 'vite-ping')) ||
                       (Array.isArray(protocols) && protocols.some(function(p) { return String(p).indexOf('vite') !== -1; })) ||
                       urlStr.indexOf('vite') !== -1 ||
                       urlStr.indexOf('token=') !== -1;
                       
          if (isVite) {
            var listeners = {};
            var fakeWs = {
              binaryType: 'blob',
              bufferedAmount: 0,
              extensions: '',
              protocol: typeof protocols === 'string' ? protocols : '',
              readyState: 1, // OPEN
              url: urlStr,
              CONNECTING: 0,
              OPEN: 1,
              CLOSING: 2,
              CLOSED: 3,
              onopen: null,
              onmessage: null,
              onerror: null,
              onclose: null,
              addEventListener: function(event, fn, opts) {
                listeners[event] = listeners[event] || [];
                listeners[event].push({ fn: fn, once: opts && opts.once });
                if (event === 'open') {
                  setTimeout(function() {
                    if (fakeWs.readyState === 1) {
                      var ev = new Event('open');
                      if (fakeWs.onopen) fakeWs.onopen(ev);
                      fn(ev);
                    }
                  }, 0);
                }
              },
              removeEventListener: function(event, fn) {
                if (!listeners[event]) return;
                listeners[event] = listeners[event].filter(function(l) { return l.fn !== fn; });
              },
              dispatchEvent: function(ev) {
                var evListeners = listeners[ev.type] || [];
                evListeners.forEach(function(l) { l.fn(ev); });
                return true;
              },
              send: function() {},
              close: function(code, reason) {
                fakeWs.readyState = 3;
                var ev = new CloseEvent('close', { code: code || 1000, reason: reason || '', wasClean: true });
                if (fakeWs.onclose) fakeWs.onclose(ev);
                (listeners['close'] || []).forEach(function(l) { l.fn(ev); });
              }
            };
            setTimeout(function() {
              if (fakeWs.onopen) fakeWs.onopen(new Event('open'));
              (listeners['open'] || []).forEach(function(l) { l.fn(new Event('open')); });
            }, 0);
            return fakeWs;
          }
          return new NativeWebSocket(url, protocols);
        };
        window.WebSocket.prototype = NativeWebSocket.prototype;
        window.WebSocket.CONNECTING = 0;
        window.WebSocket.OPEN = 1;
        window.WebSocket.CLOSING = 2;
        window.WebSocket.CLOSED = 3;

        window.addEventListener('unhandledrejection', function(event) {
          var reason = (event.reason && (event.reason.message || event.reason.stack)) || String(event.reason || '');
          if (reason.indexOf('WebSocket') !== -1 || reason.indexOf('vite') !== -1) {
            event.preventDefault();
            event.stopPropagation();
          }
        });

        window.addEventListener('error', function(event) {
          var msg = event.message || '';
          if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('vite') !== -1) {
            event.preventDefault();
            event.stopPropagation();
          }
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
